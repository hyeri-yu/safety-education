// 데이터 점검 함수: 브라우저 개발자 콘솔에서 auditSafetyVideos() 실행
function auditSafetyVideos(){
 const counts=Object.fromEntries(areas.map(([name])=>[name,videos.filter(v=>v.area===name).length]));
 const issues=videos.map((v,i)=>({index:i+1,video:v})).filter(({video:v})=>
  !v.title || !v.url || /https?:\\/\\/|제목:|초등저|초등고|중\\/고|출처:|출처 :/.test(v.title) ||
  !/^https?:\\/\\/(www\\.)?(youtube\\.com|youtu\\.be)\\//.test(v.url));
 console.table(counts); console.log('총 영상',videos.length,'점검 필요',issues); return {counts,total:videos.length,issues};
}

const STORE='rasSafetyWatched2026';
const ROTATION_START='2026-11-16';
function dayNumber(){
 const [y,m,d]=ROTATION_START.split('-').map(Number);
 const start=Date.UTC(y,m-1,d);
 const now=new Date();
 const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 return Math.max(0,Math.floor((today-start)/86400000));
}
function getDailyVideo(){
 const day=dayNumber();
 const area=areas[day%areas.length];
 const list=videos.filter(v=>v.area===area[0]);
 if(!list.length)return {area,video:null,day};
 const video=list[Math.floor(day/areas.length)%list.length];
 return {area,video,day};
}
let watched={};
try{watched=JSON.parse(localStorage.getItem(STORE)||'{}')||{};}catch(e){watched={};}
const content=document.getElementById('content');
let currentView='today';
let currentArea='';
function updateProgress(){
 const n=Object.values(watched).filter(Boolean).length;
 document.getElementById('progress').textContent=`시청 완료 ${n} / ${videos.length}`;
}
function setActiveTab(){
 document.querySelectorAll('.tab').forEach(btn=>{
  const active=(btn.dataset.view===currentView && (currentView==='today'||currentView==='all')) ||
   (currentView==='area' && btn.dataset.area===currentArea);
  btn.classList.toggle('active',active);
 });
}
function makeVideoCard(v){
 const id=String(videos.indexOf(v));
 const card=document.createElement('article');
 card.className='video'+(watched[id]?' done':'');
 const check=document.createElement('input');
 check.type='checkbox';check.className='check';check.checked=!!watched[id];
 check.setAttribute('aria-label','시청 완료 체크');
 check.onchange=()=>{watched[id]=check.checked;localStorage.setItem(STORE,JSON.stringify(watched));render();};
 const body=document.createElement('div');body.style.flex='1';
 const title=document.createElement('p');title.className='vtitle';title.textContent=v.title;
 const meta=document.createElement('div');meta.className='meta';meta.textContent=`${v.area} · 유치원 대상`;
 const a=document.createElement('a');a.className='watch';a.href=v.url;a.target='_blank';a.rel='noopener';a.textContent='▶ 영상 보기';
 body.append(title,meta,a);card.append(check,body);return card;
}

 const daily=getDailyVideo();
 const box=document.getElementById('dailyArea');
 const date=new Date();
 const dateText=date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 const [todayName,todayIcon,todayDesc]=daily.area;
 box.innerHTML=`<strong>🌞 오늘의 안전교육 · ${todayIcon} ${todayName}</strong><span>${dateText} · ${daily.day+1}일차<br>${todayDesc}<br>오늘은 영상 한 편만 함께 봐요. 내일은 다음 안전교육 영역의 영상으로 바뀝니다.</span>`;
 content.innerHTML='';
 if(currentView==='today'){
  const h=document.createElement('h2');h.className='area-heading';h.textContent='오늘의 영상 1편';content.appendChild(h);
  if(daily.video){content.appendChild(makeVideoCard(daily.video));}
  else{const msg=document.createElement('p');msg.textContent='오늘의 영역에 등록된 영상이 없습니다.';content.appendChild(msg);}
  const tip=document.createElement('p');tip.className='area-desc';tip.textContent='오늘은 이 영상 한 편만 시청해요. 내일은 다음 안전교육 영역의 영상 한 편이 자동으로 나옵니다.';content.appendChild(tip);
 }else{
  let list=[];let heading='';
  if(currentView==='all'){list=videos;heading='전체 안전교육 영상';}
  else{list=videos.filter(v=>v.area===currentArea);heading=currentArea;}
  const h=document.createElement('h2');h.className='area-heading';h.textContent=heading;content.appendChild(h);
  const desc=document.createElement('p');desc.className='area-desc';
  desc.textContent=currentView==='all'?'전체 영역의 영상을 찾아볼 수 있어요. 오늘의 영상은 ‘오늘의 영역’에서 한 편씩 확인해 주세요.':`${currentArea} 영역의 영상 ${list.length}편입니다. 오늘의 기본 학습은 ‘오늘의 영역’에서 하루 한 편씩 진행됩니다.`;
  content.appendChild(desc);
  const grid=document.createElement('div');grid.className='cards';
  list.forEach(v=>grid.appendChild(makeVideoCard(v)));content.appendChild(grid);
 }
 setActiveTab();updateProgress();
}
document.querySelectorAll('.tab').forEach(btn=>{
 btn.addEventListener('click',()=>{
  if(btn.dataset.view){currentView=btn.dataset.view;currentArea='';}
  else if(btn.dataset.area){currentView='area';currentArea=btn.dataset.area;}
  render();
 });
});
render();
</script>
